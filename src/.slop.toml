# slop — agentic code quality linter
# https://github.com/JordanGunn/agent-slop-lint
# Profile: default
#
# Every rule name carries an explicit scope prefix matching its emission
# unit: function.*, class.*, module.*, parameter.*, package.* . Cluster /
# whole-repo families (lexical.*, hotspots, deps, orphans, redundancy,
# duplication) are exempt and live at the top level.

# Root directory (default: ".")
root = "."

# Languages to analyze (default: auto-detect all supported)
# Supported: python, javascript, typescript, go, rust, java, c_sharp
# languages = ["python", "typescript"]

# Global file exclusions (applied to all rules)
exclude = ["**/test_*", "**/vendor/**"]

# Scoped waivers keep exceptional findings visible without weakening global
# thresholds. Prefer a local allow_up_to ceiling over an unbounded waiver.
# [[waivers]]
# id = "parser-npath"
# path = "src/parser/**"
# rule = "function.complexity.combinatorial"
# allow_up_to = 1200
# reason = "Parser branch shape mirrors grammar alternatives."
# expires = "2026-09-01"

[rules.function.complexity.cyclomatic]
enabled = true
threshold = 10        # fail if any function CCX exceeds this (McCabe 1976)
severity = "error"

[rules.function.complexity.cognitive]
enabled = true
threshold = 15        # fail if any function CogC exceeds this (Campbell 2018)
severity = "error"

[rules.function.complexity.combinatorial]
enabled = true
threshold = 400       # fail if any function NPath exceeds this (Nejmeh 1988)
severity = "error"

[rules.class.complexity.cyclomatic]
enabled = true
threshold = 40        # WMC: per-class sum of method CCX (CK 1994). Set to 0 to disable.
severity = "error"

[rules.class.complexity.cognitive]
enabled = true
threshold = 0         # off by default (opt-in). Set > 0 to enable per-class CogC sum.
severity = "error"

[rules.class.complexity.combinatorial]
enabled = true
threshold = 0         # off by default (opt-in). Set > 0 to enable per-class NPath sum.
severity = "error"

[rules.class.coupling]
enabled = true
threshold = 8
severity = "error"

[rules.class.inheritance.depth]
enabled = true
threshold = 4
severity = "error"

[rules.class.inheritance.children]
enabled = true
threshold = 10
severity = "error"

[rules.function.difficulty.volume]
enabled = true
threshold = 1500      # fail if any function Halstead V exceeds this
severity = "error"

[rules.function.difficulty.density]
enabled = true
threshold = 30        # fail if any function Halstead D (operand-reuse density) exceeds this
severity = "error"

[rules.function.types.hidden_mutators]
enabled = true
require_type_annotation = true   # only flag params with explicit collection types
min_mutations = 1
severity = "warning"

[rules.function.magic_literals]
enabled = true
threshold = 3         # flag functions with > 3 distinct non-trivial numeric literals
severity = "warning"

[rules.module.god_module]
enabled = true
threshold = 20        # flag files with more than this many top-level definitions
severity = "warning"

[rules.module.types.escape_hatches]
enabled = true
threshold = 0.30      # flag files where > 30% of annotations use escape-hatch types
min_annotations = 5
severity = "warning"

[rules.parameter.types.sentinels]
enabled = true
max_cardinality = 8   # flag sentinel str params with ≤ 8 distinct call-site values
require_str_annotation = true
severity = "warning"

[rules.package.rigidity]
enabled = true
# languages = ["python"]        # optional: restrict to a subset of slop's supported languages
threshold = 0.7       # flag pain-zone packages whose D' exceeds this
severity = "warning"

[rules.package.uselessness]
enabled = true
threshold = 0.7       # flag uselessness-zone packages whose D' exceeds this
severity = "warning"

[rules.hotspots]
enabled = true
since = "14 days ago"
min_commits = 2
fail_on_quadrant = ["hotspot"]
severity = "error"

[rules.deps]
enabled = true
fail_on_cycles = true
severity = "error"

[rules.orphans]
enabled = false
min_confidence = "high"
severity = "warning"

[rules.redundancy]
enabled = true
min_shared = 3        # minimum shared non-trivial callees between two sibling functions
min_score = 0.5       # minimum overlap ratio (shared / max callee count)
severity = "warning"

[rules.duplication]
enabled = true
threshold = 0.05      # flag when > 5% of functions are Type-2 clones
min_leaf_nodes = 10   # ignore trivially short functions
min_cluster_size = 2
severity = "warning"

[rules.lexical.stutter]
enabled = true
min_overlap_tokens = 2     # flag names repeating >= N tokens from any enclosing scope
check_packages = true
check_modules = true
check_classes = true
check_functions = true
severity = "warning"

[rules.lexical.verbosity]
enabled = true
max_tokens = 3             # flag function/class names with more tokens than this
check_classes = true
severity = "warning"

[rules.lexical.hammers]
enabled = true
severity = "warning"

[rules.lexical.sprawl]
enabled = true
min_alphabet = 3
min_concept_extent = 2
min_concept_intent = 2
severity = "warning"

[rules.lexical.imposters]
enabled = true
min_cluster = 3
exempt_names = ["self", "cls"]
severity = "warning"

[rules.lexical.slackers]
enabled = true
min_cluster = 3
exempt_names = ["self", "cls"]
max_coverage = 0.30
severity = "warning"

[rules.lexical.confusion]
enabled = true
min_functions = 5
min_islands = 2          # flag files splitting into >= this many disjoint call-islands
min_shared = 3           # redundancy-pair threshold feeding the island clustering
min_score = 0.5          # redundancy-pair overlap threshold
min_island_size = 2
min_cluster_size = 3     # receiver-cluster corroboration size
exempt_names = ["self", "cls"]
severity = "warning"

[rules.runts]
enabled = true
max_init_lines = 5
severity = "warning"


# ---- Waivers ----------------------------------------------------------------

[[waivers]]
id = "grammar-abc-coupling"
path = "slop/language/grammars/*.py"
rule = "coupling"
allow_up_to = 12
reason = "ABC implementation tax — coupling to Language hierarchy is inherent."

[[waivers]]
id = "tree-core-coupling"
path = "slop/tree/tree.py"
rule = "coupling"
allow_up_to = 9
reason = "Parse substrate core — Tree couples to tree-sitter and grammar types by design."
