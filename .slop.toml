# slop — config for dogfooding slop on this repo / the v1.2.0 research snapshot.
#
# v3 takes the scan target from the CLI's --root (the config holds rule settings only),
# so the former `root` / `languages` keys are gone. Threshold tweaks are intentionally
# absent: signal suppression defeats the purpose of measuring distributions.

[rules.hotspots]
enabled = false                 # the snapshot corpus has no git history — structurally N/A
